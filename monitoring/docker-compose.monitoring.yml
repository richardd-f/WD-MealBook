# Monitoring & load-testing rig for MealBook benchmarks.
#
# This is intentionally SEPARATE from the app's docker-compose.yml so the
# production deploy is never forced to run it. Bring it up from the repo root:
#
#   docker compose -f monitoring/docker-compose.monitoring.yml up -d cadvisor prometheus grafana
#
# and run a load phase on demand with the k6 service (see BENCHMARK.md).
#
# All services join the existing external `npm_default` network so that:
#   - prometheus can scrape cadvisor by name
#   - k6 can reach the app via the `web` (nginx) container by name
#
# Resource limits are set on every service so the monitoring stack cannot
# starve the app on a shared VPS. k6 is additionally capped at 10 VUs max
# to prevent the server from freezing under co-located load generation.

services:
  # ---- Resource metrics: CPU / RAM / network per container ----
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: mealbook_cadvisor
    restart: unless-stopped
    privileged: true
    expose:
      - "8080"
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - npm_default
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
        reservations:
          memory: 64M

  # ---- Time-series store + query engine ----
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: mealbook_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-remote-write-receiver"
      # Reduce memory pressure: limit in-memory chunks and WAL size.
      - "--storage.tsdb.wal-compression"
      - "--query.max-concurrency=2"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
    networks:
      - npm_default
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 256M
        reservations:
          memory: 128M

  # ---- Dashboards for RAM idle / peak CPU over each test window ----
  grafana:
    image: grafana/grafana:11.1.0
    container_name: mealbook_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Reduce Grafana's background rendering load.
      GF_RENDERING_CONCURRENT_RENDER_LIMIT: "2"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - npm_default
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
        reservations:
          memory: 64M

  # ---- Load generator (run on demand, not always-on) ----
  # Usage:
  #   docker compose -f monitoring/docker-compose.monitoring.yml run --rm \
  #     -e BASE_URL=https://mealbook.felitech.site -e RPS=50 -e DURATION=30s \
  #     k6 run /scripts/light.js
  #
  # VU cap: maxVUs is hard-limited to 10 to prevent the co-located load
  # generator from starving the app and freezing the server.
  # For light/medium this is plenty. For hard (multi-request iterations)
  # lower the RPS target so iterations finish within the VU budget.
  k6:
    image: grafana/k6:0.52.0
    container_name: mealbook_k6
    profiles: ["loadtest"]
    environment:
      BASE_URL: ${BASE_URL:-http://web}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      # Hard cap on concurrent VUs regardless of what the script requests.
      K6_VUS: ${VUS:-5}
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    networks:
      - npm_default
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 128M

networks:
  npm_default:
    external: true

volumes:
  prometheus_data:
  grafana_data:
